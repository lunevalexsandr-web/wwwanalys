services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wwwanalys
      POSTGRES_USER: wwwanalys_user
      POSTGRES_PASSWORD: wwwanalys_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwwanalys_user -d wwwanalys"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.11-slim
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wwwanalys_user:wwwanalys_password@db:5432/wwwanalys
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-secret-key}
      API_KEY: ${API_KEY:-change-me-api-key}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:5173"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    restart: unless-stopped

volumes:
  postgres_data: