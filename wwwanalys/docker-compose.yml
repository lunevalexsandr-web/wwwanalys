services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wwwanalys
      POSTGRES_USER: wwwanalys_user
      POSTGRES_PASSWORD: wwwanalys_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwwanalys_user -d wwwanalys"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.11-slim
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wwwanalys_user:wwwanalys_password@db:5432/wwwanalys
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-secret-key}
      API_KEY: ${API_KEY:-change-me-api-key}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.11-slim
    environment:
      DATABASE_URL: postgresql://wwwanalys_user:wwwanalys_password@db:5432/wwwanalys
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-secret-key}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py"
    profiles:
      - seed

  frontend:
    build: ./frontend
    image: las84/wwwanalys-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: